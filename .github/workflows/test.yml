name: Local verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local PDF font and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei
          python -m pip install -r requirements.txt
      - name: Validate frontend syntax and safety contracts
        run: |
          node --check static/app.js
          node --test tests/test_frontend.cjs
      - name: Run local suite (browser tests may explicitly skip)
        run: python -m unittest discover -s tests -v

  browser-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PDF font and isolated test browser
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei
          python -m pip install -r requirements-executor.txt
          python -m playwright install --with-deps chromium
      - name: Require working Chromium before browser suite
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as runtime:
              browser = runtime.chromium.launch(headless=True)
              browser.close()
          PY
      - name: Run local browser fixtures with no silent skips
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.TestSuite()
          for pattern in ('test_anker.py', 'test_search_browser.py', 'test_official_browser.py', 'test_moka_session.py', 'test_moka_failures.py'):
              suite.addTests(unittest.defaultTestLoader.discover('tests', pattern=pattern))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          PY
